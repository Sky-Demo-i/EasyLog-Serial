[package]
name = "easylog-serial-updater"
version = "0.4.6"
edition = "2024"
description = "Portable updater helper for EasyLog Serial"

[[bin]]
name = "EasyLogSerialUpdater"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
