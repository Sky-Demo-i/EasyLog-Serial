[package]
name = "easylog-serial"
version = "0.4.2"
description = "EasyLog Serial - serial port workbench for EasyLogger"
authors = ["lyg"]
edition = "2024"

[lib]
# Desktop-only build: keep rlib. Building cdylib/staticlib on the GNU toolchain
# hits "export ordinal too large" because Rust exports every symbol.
name = "easylog_serial_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enable for release builds so Tauri embeds the frontend assets instead of
# loading devUrl. `tauri build` sets this automatically.
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
sha2 = "0.10"
semver = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
